<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Give Feedback</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .feedback-container {
            max-width: 700px;
            margin: 40px auto;
        }

        .employee-header {
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .employee-header h1 {
            margin: 0 0 8px;
            color: #172033;
        }

        .employee-header h2 {
            margin: 0 0 8px;
            font-size: 20px;
            color: #374151;
        }

        .employee-header p {
            margin: 0;
            color: #6b7280;
        }

        .person-role {
            display: inline-block;
            margin-bottom: 10px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .person-role.manager {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .person-role.employee {
            background: #dcfce7;
            color: #15803d;
        }

        .rating-options {
            display: flex;
            gap: 10px;
            margin: 15px 0 25px;
        }

        .rating-option {
            position: relative;
        }

        .rating-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .rating-option label {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 48px;
            height: 42px;

            margin: 0;

            border: 1px solid #d1d5db;
            border-radius: 7px;

            background: white;
            color: #374151;

            cursor: pointer;

            font-weight: 600;

            transition: 0.2s;
        }

        .rating-option label:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .rating-option input:checked + label {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
        }

        .rating-help {
            color: #6b7280;
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 20px;
        }

    </style>

</head>


<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <h2>360° Feedback System</h2>

        <a class="logout"
           href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>


    <!-- MAIN CONTENT -->

    <div class="container">

        <div class="feedback-container">

            <div class="card">

                <!-- PERSON DETAILS -->

                <div class="employee-header">

                    <h1>Give Feedback</h1>

                    {% if employee["role"] == "manager" %}

                        <span class="person-role manager">
                            Manager
                        </span>

                    {% else %}

                        <span class="person-role employee">
                            Employee
                        </span>

                    {% endif %}

                    <h2>
                        {{ employee["name"] }}
                    </h2>

                    <p>
                        {{ employee["email"] }}
                    </p>

                </div>


                <!-- FORM -->

                <form method="POST">

                    <!-- RATING -->

                    <label>
                        Rating
                    </label>

                    <div class="rating-options">

                        <div class="rating-option">

                            <input
                                type="radio"
                                id="rating1"
                                name="rating"
                                value="1"
                                required
                            >

                            <label for="rating1">
                                1
                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="rating2"
                                name="rating"
                                value="2"
                            >

                            <label for="rating2">
                                2
                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="rating3"
                                name="rating"
                                value="3"
                            >

                            <label for="rating3">
                                3
                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="rating4"
                                name="rating"
                                value="4"
                            >

                            <label for="rating4">
                                4
                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="rating5"
                                name="rating"
                                value="5"
                            >

                            <label for="rating5">
                                5
                            </label>

                        </div>

                    </div>


                    <p class="rating-help">
                        1 = Needs improvement &nbsp; • &nbsp;
                        5 = Excellent
                    </p>


                    <!-- COMMENT -->

                    <label for="comment">
                        Feedback
                    </label>

                    <textarea
                        id="comment"
                        name="comment"
                        placeholder="Share your feedback about this person..."
                        required
                    ></textarea>


                    <!-- ACTIONS -->

                    <div class="form-actions">

                        <button type="submit">
                            Submit Feedback
                        </button>

                        <a
                            class="button secondary"
                            href="{{ url_for('employee_dashboard') }}"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
