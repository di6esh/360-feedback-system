<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>360° Feedback System - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        /* Login page */

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f5f7fa;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background: white;

            padding: 35px;

            border-radius: 12px;

            border: 1px solid #e5e7eb;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 55px;
            height: 55px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: #172033;
            color: white;

            font-size: 23px;
            font-weight: bold;
        }

        .login-box h1 {
            text-align: center;

            margin: 0;

            color: #172033;

            font-size: 27px;
        }

        .subtitle {
            text-align: center;

            color: #6b7280;

            margin: 8px 0 28px;

            font-size: 14px;
        }

        .login-box button {
            width: 100%;

            margin-top: 8px;

            padding: 12px;

            font-size: 15px;
        }

        .login-footer {
            text-align: center;

            margin-top: 22px;

            color: #9ca3af;

            font-size: 12px;
        }

    </style>

</head>


<body>

    <div class="login-wrapper">

        <div class="login-box">

            <!-- LOGO -->

            <div class="logo">
                360°
            </div>


            <h1>
                360° Feedback
            </h1>


            <p class="subtitle">
                Employee Feedback System
            </p>


            <!-- ERROR -->

            {% if error %}

                <div class="error">
                    {{ error }}
                </div>

            {% endif %}


            <!-- LOGIN FORM -->

            <form method="POST">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login →
                </button>

            </form>


            <div class="login-footer">
                360° Feedback System
            </div>

        </div>

    </div>

</body>

</html>
